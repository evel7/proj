<html>
	<head>
		<title> Мой первый документ </title>
	</head>
	<body>
		<h1> Мой первый HTML-документ </h1>
		<hr size="4" width="70%" color="#1E4FA0" align="center">
		<blockquote><h2><q>Евгений Онегин</q></h2></blockquote>
		<p align="right">
			<font face="Georgia" size="4" color="#333333" style="text-decoration: underline; text-shadow: 2px 2px 3px #808080;"><u>А.С. Пушкин (отрывок)</u></font>
		</p>
		<p>Мой дядя самых честных правил,<br>
			Когда не в шутку занемог,<br>
			Он уважать себя заставил<br>
			И лучше выдумать не мог.
		</p>
		<p align="center"><b>Жирный текст</b>, <em>логическое выделение</em>, <i>курсив</i>, <u>подчёркнутый текст</u>.</p>
	</body>
